secrets:
  - DOCKERHUB_TOKEN

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCOUNT_ID: "123456789012"
  AWS_ECR_REPO_NAME: example-frontend
  NPM_VERSION: "10.9.2"

steps:
  - label: "propagate-environment only, no explicit environment list"
    key: propagate-only
    agents:
      queue: mac
    plugins:
      - docker#v5.11.0:
          image: alpine:3.20
          propagate-environment: true
    command: |
      set -eu
      echo "--- commit=$${BUILDKITE_COMMIT}"
      if [ -z "$$DOCKERHUB_TOKEN" ]; then
        echo "DOCKERHUB_TOKEN is not set inside container"
        exit 1
      fi
      echo "token length inside container: $${#DOCKERHUB_TOKEN}"
      echo "npm: $${NPM_VERSION}"
      echo "ecr: $${AWS_ACCOUNT_ID}.dkr.ecr.$${AWS_DEFAULT_REGION}.amazonaws.com/$${AWS_ECR_REPO_NAME}"
      echo "PROPAGATE-ONLY OK"
