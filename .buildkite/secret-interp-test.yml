secrets:
  - DOCKERHUB_TOKEN

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCOUNT_ID: "123456789012"
  AWS_ECR_REPO_NAME: example-frontend

steps:

  # ============================================================
  # BROKEN: customer's exact pattern, with $VAR (single dollar)
  # ============================================================
  - label: "BROKEN-1: command-body refs (no docker)"
    key: broken-1
    agents:
      queue: mac
    command: |
      set -eu
      echo "--- commit=${BUILDKITE_COMMIT}"
      if [ -z $DOCKERHUB_TOKEN ]; then
        echo "DOCKERHUB_TOKEN is not set"
        exit 1
      fi
      echo "would run git config with token=${DOCKERHUB_TOKEN}"

  - label: "BROKEN-2: docker plugin with environment: [$VAR]"
    key: broken-2
    agents:
      queue: mac
    plugins:
      - docker#v5.11.0:
          image: alpine:3.20
          environment: [$DOCKERHUB_TOKEN]
    command: |
      set -eu
      if [ -z $DOCKERHUB_TOKEN ]; then
        echo "DOCKERHUB_TOKEN is not set"
        exit 1
      fi
      echo "got token: $DOCKERHUB_TOKEN"

  # ============================================================
  # FIXED: $$VAR escapes + plugin environment by name
  # ============================================================
  - label: "FIXED-1: command-body refs (no docker)"
    key: fixed-1
    agents:
      queue: mac
    command: |
      set -eu
      echo "--- commit=$${BUILDKITE_COMMIT}"
      if [ -z "$$DOCKERHUB_TOKEN" ]; then
        echo "DOCKERHUB_TOKEN is not set"
        exit 1
      fi
      echo "would run git config with token of length=$${#DOCKERHUB_TOKEN}"

  - label: "FIXED-2: docker plugin with environment by name"
    key: fixed-2
    agents:
      queue: mac
    plugins:
      - docker#v5.11.0:
          image: alpine:3.20
          environment:
            - DOCKERHUB_TOKEN
    command: |
      set -eu
      if [ -z "$$DOCKERHUB_TOKEN" ]; then
        echo "DOCKERHUB_TOKEN is not set"
        exit 1
      fi
      echo "got token of length=$${#DOCKERHUB_TOKEN}"
