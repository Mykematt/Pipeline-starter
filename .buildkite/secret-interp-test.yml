secrets:
  - DOCKERHUB_TOKEN

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCOUNT_ID: "123456789012"
  AWS_ECR_REPO_NAME: example-frontend
  NPM_VERSION: "10.9.2"

steps:
  - label: "Customer-shape: docker plugin + secret + interpolation, FIXED"
    key: customer-fixed
    agents:
      queue: mac
    plugins:
      - docker#v5.11.0:
          image: alpine:3.20
          environment:
            - DOCKERHUB_TOKEN
    command: |
      set -eu
      echo "--- commit=$${BUILDKITE_COMMIT}"

      if [ -z "$$DOCKERHUB_TOKEN" ]; then
        echo "DOCKERHUB_TOKEN is not set"
        exit 1
      fi

      # Mirror the customer's git config line, but harmless inside alpine
      echo "would run: git config --global url.\"https://x-access-token:$${DOCKERHUB_TOKEN}@github.com/\".insteadOf \"https://github.com/\""

      echo "token length: $${#DOCKERHUB_TOKEN}"
      echo "npm target version: $${NPM_VERSION}"
      echo "ecr target: $${AWS_ACCOUNT_ID}.dkr.ecr.$${AWS_DEFAULT_REGION}.amazonaws.com/$${AWS_ECR_REPO_NAME}:$${BUILDKITE_COMMIT}"

      echo "FIXED PATTERN OK"
