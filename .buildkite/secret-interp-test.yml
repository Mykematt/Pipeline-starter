secrets:
  - DOCKERHUB_TOKEN

steps:
  - label: "A. unescaped reference in command (broken)"
    key: a-unescaped
    agents:
      queue: mac
    command: |
      echo "RAW_A: '$DOCKERHUB_TOKEN'"
      env | grep DOCKERHUB || true

  - label: "B. escaped reference in command (fixed)"
    key: b-escaped
    agents:
      queue: mac
    command: |
      echo "RAW_B: '$$DOCKERHUB_TOKEN'"
      env | grep DOCKERHUB || true

  - label: "C. docker plugin, environment uses VALUE (broken pattern)"
    key: c-docker-broken
    agents:
      queue: mac
    plugins:
      - docker#v5.11.0:
          image: alpine:3.20
          environment: [$DOCKERHUB_TOKEN]
    command: |
      echo "RAW_C: '$$DOCKERHUB_TOKEN'"
      env | grep DOCKERHUB || true

  - label: "D. docker plugin, environment uses NAME + escaped command (fixed pattern)"
    key: d-docker-fixed
    agents:
      queue: mac
    plugins:
      - docker#v5.11.0:
          image: alpine:3.20
          environment:
            - DOCKERHUB_TOKEN
    command: |
      echo "RAW_D: '$$DOCKERHUB_TOKEN'"
      env | grep DOCKERHUB || true
